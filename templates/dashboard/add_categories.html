{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">

    <!--loads the left side bar content-->
    {% include 'dashboard/sidebar.html' %}


    <!--loads the right side bar content-->
    <div class="col-md-9">
        <h3> All New Category</h3>
        
        <form class="{% url 'add_category' %}" method="POST" style="width: 500px;">
            {% csrf_token %}
            {{ form | crispy }}

            <button type="submit" class="btn btn-warning">submit</button>
        </form>

    </div>    
</div>

{% endblock %}
