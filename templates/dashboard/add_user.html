{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">

    <!--loads the left side bar content-->
    {% include 'dashboard/sidebar.html' %}


    <!--loads the right side bar content-->
    <div class="col-md-9">
        {% if perms.auth.views_user %}
        <h3>Add New User</h3>
        
        <form action="{% url 'add_user' %}"  method="POST" style="width: 500px;">
            {% csrf_token %}
            {{ form | crispy }}

            <button type="submit" class="btn btn-warning">Add</button>
        </form>
        {% else %}
        <h4> you don't have permission to view this page</h4>
        {% endif %}
    </div>    
</div>

{% endblock %}
