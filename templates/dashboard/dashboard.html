{% extends 'base.html' %}

{% block content %}
<div class="row">
    <!--left side content-->
    <!--loads the sidebar content here--> 

    {% include 'dashboard/sidebar.html' %}

    <!--right side content-->
    <div class="col-md-9">
        <span>You have logged in as <b>{{ user }}</b></span>
        <div class="row">
            <div class="col">
               <div class="card border-default mb-3">
                <div class="card-header text-center text-uppercase font-weight-bold">Categories</div>
                <div class="card-body text-dark">
                    <h5 class="card--title text-center">{{ categories_count }}</h5>
                </div>
               </div>
            </div>
             <div class="col">
               <div class="card border-default mb-3">
                <div class="card-header text-center text-uppercase font-weight-bold">Posts</div>
                <div class="card-body text-dark">
                    <h5 class="card--title text-center">{{ blogs_count }}</h5>
                </div>
               </div>
            </div>
        </div>
           

    </div>

</div>

{% endblock %}
