{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">

    <!--loads the left side bar content-->
    {% include 'dashboard/sidebar.html' %}


    <!--loads the right side bar content-->
    <div class="col-md-9">
        <h3>Edit User</h3>
        
        <form action="{% url 'edit_user' user.id %}"  method="POST" style="width: 500px;">
            {% csrf_token %}
            {{ form | crispy }}

            <button type="submit" class="btn btn-warning">Submit</button>
        </form>

    </div>    
</div>

{% endblock %}
