{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
<h3 class="text-center">Registation Form</h3>
<form action="{% url 'register' %}" method="POST" style="width: 30rem; margin:auto;">
    {% csrf_token %}
    {{ form | crispy }}

    <button type="submit" class="btn btn-warning">submit</button>
</form>

{% endblock %}
